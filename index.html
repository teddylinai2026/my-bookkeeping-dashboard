<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人收支多維度互動財務儀表板</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Chart.js DataLabels 外掛 -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
    <!-- PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

    <div class="max-w-7xl mx-auto px-4 py-6">
        <!-- 頁首與設定 -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-6 rounded-xl shadow-sm mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">📊 個人收支多維度互動儀表板</h1>
                <p class="text-sm text-gray-500 mt-1" id="status-text">狀態：未連接資料來源</p>
            </div>
            
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="sheet-url" placeholder="貼上 Google Sheets 發佈的 CSV 網址..." 
                       class="px-4 py-2 border rounded-lg w-full sm:w-80 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="saveAndSync()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm">
                    同步數據
                </button>
            </div>
        </div>

        <!-- 交叉篩選控制面板 -->
        <div class="bg-white p-5 rounded-xl shadow-sm mb-6 border border-gray-100">
            <div class="flex justify-between items-center mb-3">
                <h3 class="font-bold text-gray-800 text-base flex items-center gap-2">
                    <span>🔍</span> 多維度交叉篩選器
                </h3>
                <button onclick="resetAllFilters()" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-1.5 rounded-lg transition font-medium">
                    🔄 重設所有篩選
                </button>
            </div>

            <!-- 時間區段選單 -->
            <div class="flex flex-wrap items-center gap-2 pb-3 mb-4 border-b border-gray-100 text-sm">
                <span class="font-semibold text-gray-600 mr-1">時間：</span>
                <button onclick="setDateQuickFilter('all')" id="btn-time-all" class="time-btn bg-blue-50 text-blue-600 font-medium px-3 py-1 rounded-lg">全部</button>
                <button onclick="setDateQuickFilter('thisMonth')" id="btn-time-thisMonth" class="time-btn bg-gray-100 text-gray-600 px-3 py-1 rounded-lg">本月</button>
                <button onclick="setDateQuickFilter('lastMonth')" id="btn-time-lastMonth" class="time-btn bg-gray-100 text-gray-600 px-3 py-1 rounded-lg">上個月</button>
                
                <div class="flex items-center gap-2 ml-auto">
                    <input type="date" id="start-date" onchange="onFilterChange()" class="border rounded px-2 py-1 text-xs">
                    <span class="text-gray-400 text-xs">至</span>
                    <input type="date" id="end-date" onchange="onFilterChange()" class="border rounded px-2 py-1 text-xs">
                </div>
            </div>

            <!-- 6 維度下拉選單網格 (預設最新年份、預設支出) -->
            <div class="grid grid-cols-2 md:grid-cols-6 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">年份 (預設最新)</label>
                    <select id="filter-year" onchange="onFilterChange()" class="w-full border rounded-lg p-2 text-xs bg-gray-50 focus:bg-white focus:ring-1 focus:ring-blue-500">
                        <option value="">全部年份</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">交易型態 (預設支出)</label>
                    <select id="filter-type" onchange="onFilterChange()" class="w-full border rounded-lg p-2 text-xs bg-gray-50 focus:bg-white focus:ring-1 focus:ring-blue-500">
                        <option value="">全部型態</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">幣別</label>
                    <select id="filter-currency" onchange="onFilterChange()" class="w-full border rounded-lg p-2 text-xs bg-gray-50 focus:bg-white focus:ring-1 focus:ring-blue-500">
                        <option value="">全部幣別</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">人員</label>
                    <select id="filter-person" onchange="onFilterChange()" class="w-full border rounded-lg p-2 text-xs bg-gray-50 focus:bg-white focus:ring-1 focus:ring-blue-500">
                        <option value="">全部人員</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">類別</label>
                    <select id="filter-category" onchange="onFilterChange()" class="w-full border rounded-lg p-2 text-xs bg-gray-50 focus:bg-white focus:ring-1 focus:ring-blue-500">
                        <option value="">全部類別</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">付款方式</label>
                    <select id="filter-payment" onchange="onFilterChange()" class="w-full border rounded-lg p-2 text-xs bg-gray-50 focus:bg-white focus:ring-1 focus:ring-blue-500">
                        <option value="">全部付款方式</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- KPI 指標 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-green-500">
                <p class="text-xs font-medium text-gray-500">總收入 (不受型態篩選影響)</p>
                <h3 class="text-xl md:text-2xl font-bold text-gray-900 mt-1" id="kpi-income">$0</h3>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-red-500">
                <p class="text-xs font-medium text-gray-500">總支出 (不受型態篩選影響)</p>
                <h3 class="text-xl md:text-2xl font-bold text-gray-900 mt-1" id="kpi-expense">$0</h3>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-500">
                <p class="text-xs font-medium text-gray-500">淨結餘</p>
                <h3 class="text-xl md:text-2xl font-bold text-gray-900 mt-1" id="kpi-balance">$0</h3>
            </div>
        </div>

        <!-- 圖表展示區 -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
            <div class="bg-white p-5 rounded-xl shadow-sm">
                <h4 class="font-bold text-gray-800 mb-4 text-sm">收支類別分佈</h4>
                <div class="h-64"><canvas id="categoryChart"></canvas></div>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm">
                <h4 class="font-bold text-gray-800 mb-4 text-sm">收支幣別分佈</h4>
                <div class="h-64"><canvas id="currencyChart"></canvas></div>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm">
                <h4 class="font-bold text-gray-800 mb-4 text-sm">收支付款方式分佈</h4>
                <div class="h-64"><canvas id="paymentChart"></canvas></div>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm">
                <h4 class="font-bold text-gray-800 mb-4 text-sm">人員收支分佈</h4>
                <div class="h-64"><canvas id="personChart"></canvas></div>
            </div>
        </div>

        <!-- 明細表格 -->
        <div class="bg-white p-5 rounded-xl shadow-sm">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-3 mb-4">
                <h4 class="font-bold text-gray-800 text-sm">交易明細列表</h4>
                <input type="text" id="search-input" onkeyup="renderTable()" placeholder="搜尋關鍵字 (項目/備註)..." 
                       class="border rounded-lg px-3 py-1.5 text-xs w-full sm:w-64">
            </div>
            <div class="overflow-x-auto max-h-96">
                <table class="w-full text-left border-collapse text-xs">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 border-b">
                            <th class="p-3">日期</th>
                            <th class="p-3">交易項目</th>
                            <th class="p-3">型態</th>
                            <th class="p-3">幣別</th>
                            <th class="p-3">金額</th>
                            <th class="p-3">人員</th>
                            <th class="p-3">類別</th>
                            <th class="p-3">付款方式</th>
                            <th class="p-3">備註</th>
                        </tr>
                    </thead>
                    <tbody id="data-table-body" class="divide-y text-gray-700">
                        <!-- 動態資料列 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 註冊 ChartDataLabels 外掛
        Chart.register(ChartDataLabels);

        let rawData = [];
        let filteredData = [];
        let categoryChart, currencyChart, paymentChart, personChart;
        let currentTimeRange = 'all';

        const filterKeys = {
            type: '交易型態',
            currency: '幣別',
            person: '人員',
            category: '類別',
            payment: '付款方式'
        };

        window.onload = function() {
            const savedUrl = localStorage.getItem('gsheet_csv_url');
            if (savedUrl) {
                document.getElementById('sheet-url').value = savedUrl;
                fetchData(savedUrl);
            }
        };

        function saveAndSync() {
            const url = document.getElementById('sheet-url').value.trim();
            if (!url) return alert('請先貼上 Google Sheets 發佈的 CSV 網址');
            localStorage.setItem('gsheet_csv_url', url);
            fetchData(url);
        }

        function fetchData(url) {
            document.getElementById('status-text').innerText = '狀態：正在載入數據...';
            Papa.parse(url, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    rawData = results.data.filter(d => d.日期 || d.交易項目);
                    document.getElementById('status-text').innerText = `狀態：已同步，共 ${rawData.length} 筆明細`;
                    resetAllFilters();
                },
                error: function(err) {
                    document.getElementById('status-text').innerText = '狀態：載入失敗，請檢查 CSV 網址是否正確';
                }
            });
        }

        function getFilteredDataset(excludeField = null) {
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;
            const selectedYear = document.getElementById('filter-year').value;

            return rawData.filter(d => {
                const rowYear = d.日期 ? String(d.日期).trim().substring(0, 4) : '';
                if (excludeField !== 'year' && selectedYear && rowYear !== selectedYear) return false;

                if (currentTimeRange === 'thisMonth') {
                    const now = new Date().toISOString().slice(0, 7);
                    if (!d.日期 || !d.日期.startsWith(now)) return false;
                } else if (currentTimeRange === 'lastMonth') {
                    const prev = new Date();
                    prev.setMonth(prev.getMonth() - 1);
                    const prevStr = prev.toISOString().slice(0, 7);
                    if (!d.日期 || !d.日期.startsWith(prevStr)) return false;
                } else if (startDate || endDate) {
                    if (startDate && d.日期 < startDate) return false;
                    if (endDate && d.日期 > endDate) return false;
                }

                for (const [key, colName] of Object.entries(filterKeys)) {
                    if (key === excludeField) continue;
                    const val = document.getElementById(`filter-${key}`).value;
                    if (val && d[colName] !== val) return false;
                }

                return true;
            });
        }

        function updateDropdownOptions() {
            // 1. 年份下拉選單動態更新
            const yearSelect = document.getElementById('filter-year');
            const currentYear = yearSelect.value;
            const availableForYear = getFilteredDataset('year');
            const uniqueYears = [...new Set(availableForYear.map(d => d.日期 ? String(d.日期).trim().substring(0, 4) : '').filter(y => y && y.length === 4))].sort().reverse();

            yearSelect.innerHTML = '<option value="">全部年份</option>';
            uniqueYears.forEach(y => {
                const opt = document.createElement('option');
                opt.value = y;
                opt.textContent = y + ' 年';
                if (y === currentYear) opt.selected = true;
                yearSelect.appendChild(opt);
            });

            if (currentYear && uniqueYears.includes(currentYear)) {
                yearSelect.value = currentYear;
            }

            // 2. 其餘維度下拉選單動態更新
            for (const [key, colName] of Object.entries(filterKeys)) {
                const selectEl = document.getElementById(`filter-${key}`);
                const currentVal = selectEl.value;

                const availableData = getFilteredDataset(key);
                const uniqueOptions = [...new Set(availableData.map(d => d[colName]).filter(Boolean))].sort();

                selectEl.innerHTML = `<option value="">全部${filterKeys[key]}</option>`;
                uniqueOptions.forEach(optVal => {
                    const opt = document.createElement('option');
                    opt.value = optVal;
                    opt.textContent = optVal;
                    if (optVal === currentVal) opt.selected = true;
                    selectEl.appendChild(opt);
                });

                if (currentVal && !uniqueOptions.includes(currentVal)) {
                    selectEl.value = '';
                }
            }
        }

        function onFilterChange() {
            updateDropdownOptions();
            filteredData = getFilteredDataset();
            renderAll();
        }

        function setDateQuickFilter(range) {
            currentTimeRange = range;
            document.querySelectorAll('.time-btn').forEach(btn => {
                btn.className = 'time-btn bg-gray-100 text-gray-600 px-3 py-1 rounded-lg';
            });
            document.getElementById(`btn-time-${range}`).className = 'time-btn bg-blue-50 text-blue-600 font-medium px-3 py-1 rounded-lg';

            document.getElementById('start-date').value = '';
            document.getElementById('end-date').value = '';

            onFilterChange();
        }

        function resetAllFilters() {
            currentTimeRange = 'all';
            document.querySelectorAll('.time-btn').forEach(btn => {
                btn.className = 'time-btn bg-gray-100 text-gray-600 px-3 py-1 rounded-lg';
            });
            document.getElementById('btn-time-all').className = 'time-btn bg-blue-50 text-blue-600 font-medium px-3 py-1 rounded-lg';

            document.getElementById('start-date').value = '';
            document.getElementById('end-date').value = '';
            document.getElementById('filter-year').value = '';

            for (const key of Object.keys(filterKeys)) {
                document.getElementById(`filter-${key}`).value = '';
            }

            updateDropdownOptions();

            // 預設最新年份
            const yearSelect = document.getElementById('filter-year');
            if (yearSelect.options.length > 1) {
                yearSelect.selectedIndex = 1;
            }

            // 預設交易型態為「支出」
            const typeSelect = document.getElementById('filter-type');
            if (Array.from(typeSelect.options).some(o => o.value === '支出')) {
                typeSelect.value = '支出';
            }

            onFilterChange();
        }

        function renderAll() {
            renderKPIs();
            renderCharts();
            renderTable();
        }

        function renderKPIs() {
            const kpiData = getFilteredDataset('type');
            let income = 0, expense = 0;
            kpiData.forEach(d => {
                const amt = parseFloat(d.金額) || 0;
                if (d.交易型態 === '收入') income += amt;
                else if (d.交易型態 === '支出') expense += amt;
            });

            const balance = income - expense;

            document.getElementById('kpi-income').innerText = '$' + income.toLocaleString();
            document.getElementById('kpi-expense').innerText = '$' + expense.toLocaleString();
            document.getElementById('kpi-balance').innerText = '$' + balance.toLocaleString();
        }

        function renderCharts() {
            const selectedType = document.getElementById('filter-type').value;

            const catMap = {}, currencyMap = {}, paymentMap = {}, personMap = {};

            filteredData.forEach(d => {
                const amt = parseFloat(d.金額) || 0;

                if (d.類別) catMap[d.類別] = (catMap[d.類別] || 0) + amt;
                if (d.幣別) currencyMap[d.幣別] = (currencyMap[d.幣別] || 0) + amt;
                if (d.付款方式) paymentMap[d.付款方式] = (paymentMap[d.付款方式] || 0) + amt;
                if (d.人員) personMap[d.人員] = (personMap[d.人員] || 0) + amt;
            });

            [categoryChart, currencyChart, paymentChart, personChart].forEach(c => c && c.destroy());

            const isIncome = selectedType === '收入';
            const labelText = selectedType ? `${selectedType}金額` : '金額';

            // 通用 Tooltip 格式化函式（顯示：項目名稱: $金額 (佔比%)）
            const tooltipCallback = {
                label: function(context) {
                    const label = context.label || '';
                    const val = context.raw || 0;
                    const sum = context.dataset.data.reduce((a, b) => a + b, 0);
                    const pct = sum ? ((val * 100) / sum).toFixed(1) : '0.0';
                    return ` ${label}: $${val.toLocaleString()} (${pct}%)`;
                }
            };

            // 1. 收支類別分佈 (圓餅圖)
            categoryChart = new Chart(document.getElementById('categoryChart'), {
                type: 'doughnut',
                data: {
                    labels: Object.keys(catMap),
                    datasets: [{
                        data: Object.values(catMap),
                        backgroundColor: ['#f87171', '#60a5fa', '#34d399', '#fbbf24', '#a78bfa', '#f472b6', '#9ca3af', '#f97316', '#38bdf8']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        datalabels: { display: false },
                        tooltip: { callbacks: tooltipCallback }
                    }
                }
            });

            // 2. 收支幣別分佈 (柱狀圖)
            currencyChart = new Chart(document.getElementById('currencyChart'), {
                type: 'bar',
                data: {
                    labels: Object.keys(currencyMap),
                    datasets: [{
                        label: labelText,
                        data: Object.values(currencyMap),
                        backgroundColor: isIncome ? '#10b981' : '#f59e0b'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        datalabels: { display: false },
                        tooltip: { callbacks: tooltipCallback }
                    }
                }
            });

            // 3. 收支付款方式分佈 (柱狀圖)
            paymentChart = new Chart(document.getElementById('paymentChart'), {
                type: 'bar',
                data: {
                    labels: Object.keys(paymentMap),
                    datasets: [{
                        label: labelText,
                        data: Object.values(paymentMap),
                        backgroundColor: isIncome ? '#10b981' : '#3b82f6'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        datalabels: { display: false },
                        tooltip: { callbacks: tooltipCallback }
                    }
                }
            });

            // 4. 人員收支分佈 (柱狀圖)
            personChart = new Chart(document.getElementById('personChart'), {
                type: 'bar',
                data: {
                    labels: Object.keys(personMap),
                    datasets: [{
                        label: labelText,
                        data: Object.values(personMap),
                        backgroundColor: isIncome ? '#34d399' : '#8b5cf6'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        datalabels: { display: false },
                        tooltip: { callbacks: tooltipCallback }
                    }
                }
            });
        }

        function renderTable() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const tbody = document.getElementById('data-table-body');
            tbody.innerHTML = '';

            filteredData.forEach(d => {
                const searchTarget = `${d.交易項目 || ''} ${d.備註 || ''} ${d.付款方式 || ''} ${d.類別 || ''}`.toLowerCase();
                if (query && !searchTarget.includes(query)) return;

                const tr = document.createElement('tr');
                const isIncome = d.交易型態 === '收入';
                tr.innerHTML = `
                    <td class="p-3">${d.日期 || ''}</td>
                    <td class="p-3 font-medium">${d.交易項目 || ''}</td>
                    <td class="p-3"><span class="px-2 py-0.5 rounded text-xs ${isIncome ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">${d.交易型態 || ''}</span></td>
                    <td class="p-3">${d.幣別 || '台幣'}</td>
                    <td class="p-3 font-bold ${isIncome ? 'text-green-600' : 'text-red-600'}">$${(parseFloat(d.金額) || 0).toLocaleString()}</td>
                    <td class="p-3">${d.人員 || ''}</td>
                    <td class="p-3">${d.類別 || ''}</td>
                    <td class="p-3">${d.付款方式 || ''}</td>
                    <td class="p-3 text-gray-500">${d.備註 || ''}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
